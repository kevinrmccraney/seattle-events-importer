name: Import normalized event feeds
on:
  workflow_dispatch:
  schedule:
    # Runs after the feed producer's weekly refresh.
    - cron: '47 14 * * 1'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m seattle_importer.main
        env:
          FEED_BASE_URL: ${{ vars.FEED_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
